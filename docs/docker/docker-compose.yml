name: ops-platform

services:
  db:
    image: mariadb:10.11
    container_name: ops-platform-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ${SPUG_DATA_ROOT:-./data}/mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ops_platform}
      MYSQL_USER: ${MYSQL_USER:-ops_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: ops-platform-guacd
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - remote_gateway

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: ops-platform-guacamole
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${SPUG_GUACAMOLE_JSON_SECRET_KEY:?SPUG_GUACAMOLE_JSON_SECRET_KEY is required}
      # Preserve real client IPs so Guacamole's built-in ban extension does
      # not treat every user behind the ops-platform proxy as one shared address.
      REMOTE_IP_VALVE_ENABLED: "true"
      REMOTE_IP_VALVE_REMOTE_IP_HEADER: X-Forwarded-For
      REMOTE_IP_VALVE_PROTOCOL_HEADER: X-Forwarded-Proto
    depends_on:
      guacd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/guacamole/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - frontend
      - remote_gateway

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: ops-platform-alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${SPUG_OBSERVABILITY_SECRETS_ROOT:-./secrets}/alertmanager_webhook_token:/run/secrets/alertmanager_webhook_token:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ops-platform-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${SPUG_PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/rules/alert-rules.yml:ro
      - ${SPUG_OBSERVABILITY_SECRETS_ROOT:-./secrets}/prometheus_discovery_token:/run/secrets/prometheus_discovery_token:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ops-platform-node-exporter
    restart: unless-stopped
    pid: host
    security_opt:
      - no-new-privileges:true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - observability

  ops-platform:
    # The legacy M0 image currently depends on CentOS 7 x86_64 packages.
    platform: ${SPUG_PLATFORM:-linux/amd64}
    build:
      # Build from the repository root so the image contains this fork's API
      # and web sources instead of downloading an upstream release at runtime.
      context: ../..
      dockerfile: docs/docker/Dockerfile
    image: ${SPUG_IMAGE:-ops-platform:local}
    container_name: ops-platform
    restart: unless-stopped
    init: true
    cap_add:
      # SSHFS file distribution requires FUSE mount capability.
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${SPUG_DATA_ROOT:-./data}/service/logs:/data/ops-platform/ops_api/logs
      - ${SPUG_DATA_ROOT:-./data}/service/storage:/data/ops-platform/ops_api/storage
      - ${SPUG_DATA_ROOT:-./data}/repos:/data/repos
      - ${SPUG_OBSERVABILITY_SECRETS_ROOT:-./secrets}/prometheus_discovery_token:/run/secrets/prometheus_discovery_token:ro
      - ${SPUG_OBSERVABILITY_SECRETS_ROOT:-./secrets}/alertmanager_webhook_token:/run/secrets/alertmanager_webhook_token:ro
      - ${SPUG_SECRETS_ROOT:-./secrets}:/run/ops-platform-secrets:ro
    ports:
      # Keep the service private by default. Put a TLS reverse proxy in front
      # or explicitly change SPUG_BIND_HOST for a trusted network.
      - ${SPUG_BIND_HOST:-127.0.0.1}:${SPUG_PORT:-80}:80
    environment:
      SPUG_ENV: production
      SPUG_SECRET_KEY: ${SPUG_SECRET_KEY:?SPUG_SECRET_KEY is required}
      SPUG_CREDENTIAL_MASTER_KEY: ${SPUG_CREDENTIAL_MASTER_KEY:?SPUG_CREDENTIAL_MASTER_KEY is required}
      SPUG_CREDENTIAL_KEYRING: ${SPUG_CREDENTIAL_KEYRING:-}
      SPUG_CREDENTIAL_PRIMARY_KEY_ID: ${SPUG_CREDENTIAL_PRIMARY_KEY_ID:-primary}
      SPUG_AUDIT_SIGNING_KEY: ${SPUG_AUDIT_SIGNING_KEY:?SPUG_AUDIT_SIGNING_KEY is required}
      SPUG_REMOTE_GATEWAY_ENABLED: ${SPUG_REMOTE_GATEWAY_ENABLED:-true}
      SPUG_GUACAMOLE_JSON_SECRET_KEY: ${SPUG_GUACAMOLE_JSON_SECRET_KEY:?SPUG_GUACAMOLE_JSON_SECRET_KEY is required}
      SPUG_GUACAMOLE_PUBLIC_URL: ${SPUG_GUACAMOLE_PUBLIC_URL:-/guacamole}
      SPUG_REMOTE_TICKET_TTL: ${SPUG_REMOTE_TICKET_TTL:-60}
      SPUG_GUACAMOLE_AUTH_TTL: ${SPUG_GUACAMOLE_AUTH_TTL:-60}
      SPUG_OBSERVABILITY_ENABLED: ${SPUG_OBSERVABILITY_ENABLED:-true}
      SPUG_PROMETHEUS_DISCOVERY_TOKEN_FILE: /run/secrets/prometheus_discovery_token
      SPUG_ALERTMANAGER_WEBHOOK_TOKEN_FILE: /run/secrets/alertmanager_webhook_token
      SPUG_PROMETHEUS_URL: http://prometheus:9090
      SPUG_ALERTMANAGER_URL: http://alertmanager:9093
      SPUG_OBSERVABILITY_REQUEST_TIMEOUT: ${SPUG_OBSERVABILITY_REQUEST_TIMEOUT:-10}
      SPUG_ALERT_RETENTION_DAYS: ${SPUG_ALERT_RETENTION_DAYS:-90}
      SPUG_AIOPS_ENABLED: ${SPUG_AIOPS_ENABLED:-false}
      SPUG_AIOPS_API_FORMAT: ${SPUG_AIOPS_API_FORMAT:-openai}
      SPUG_AIOPS_BASE_URL: ${SPUG_AIOPS_BASE_URL:-http://127.0.0.1:11434/v1}
      SPUG_AIOPS_MODEL: ${SPUG_AIOPS_MODEL:-}
      SPUG_AIOPS_API_KEY_FILE: ${SPUG_AIOPS_API_KEY_FILE:-}
      SPUG_AIOPS_JSON_MODE: ${SPUG_AIOPS_JSON_MODE:-true}
      SPUG_AIOPS_REQUEST_TIMEOUT: ${SPUG_AIOPS_REQUEST_TIMEOUT:-30}
      SPUG_AIOPS_MAX_HOSTS: ${SPUG_AIOPS_MAX_HOSTS:-20}
      SPUG_AIOPS_KNOWLEDGE_LIMIT: ${SPUG_AIOPS_KNOWLEDGE_LIMIT:-8}
      SPUG_AIOPS_MAX_OUTPUT_TOKENS: ${SPUG_AIOPS_MAX_OUTPUT_TOKENS:-2000}
      SPUG_AIOPS_MAX_RESPONSE_BYTES: ${SPUG_AIOPS_MAX_RESPONSE_BYTES:-1048576}
      SPUG_AIOPS_RATE_LIMIT_PER_MINUTE: ${SPUG_AIOPS_RATE_LIMIT_PER_MINUTE:-5}
      SPUG_ALLOWED_HOSTS: ${SPUG_ALLOWED_HOSTS:?SPUG_ALLOWED_HOSTS is required}
      SPUG_CSRF_TRUSTED_ORIGINS: ${SPUG_CSRF_TRUSTED_ORIGINS:-}
      SPUG_SECURE_COOKIES: ${SPUG_SECURE_COOKIES:-true}
      SPUG_SSL_REDIRECT: ${SPUG_SSL_REDIRECT:-false}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ops_platform}
      MYSQL_USER: ${MYSQL_USER:-ops_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
      guacamole:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - frontend
      - backend
      - observability

networks:
  frontend:
  backend:
    internal: true
  # guacd needs outbound access to managed RDP/VNC hosts. Do not publish its
  # port; restrict this bridge's egress with the host firewall in production.
  remote_gateway:
  observability:
    # No ports are published, but Prometheus needs egress to approved managed
    # hosts. Use an explicit subnet to avoid overlapping a managed host or
    # model service network. Restrict destination ranges with the host firewall.
    ipam:
      config:
        - subnet: ${SPUG_OBSERVABILITY_SUBNET:-172.23.0.0/16}

volumes:
  prometheus_data:
  alertmanager_data:
