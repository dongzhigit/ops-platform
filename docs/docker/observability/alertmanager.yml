global:
  resolve_timeout: 5m

route:
  receiver: ops-platform-webhook
  group_by: [alertname, ops_platform_host_id]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: ops-platform-webhook
    webhook_configs:
      - url: http://ops-platform/api/v1/observability/alertmanager/webhook/
        send_resolved: true
        max_alerts: 500
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alertmanager_webhook_token
